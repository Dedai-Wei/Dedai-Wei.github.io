<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Empirical framework for low-carbon pilot cities and firm financialization</title>
  <desc id="desc">A compact academic diagram linking policy exposure to listed-firm financialization, with causal-identification and validation modules.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#376f86"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#376f86;stroke-width:2.5;rx:10}
      .soft{fill:#edf5f6;stroke:#7298a8;stroke-width:2;rx:8}
      .accent{fill:#f7eee7;stroke:#b56a3b;stroke-width:2.5;rx:10}
      .label{font:600 20px Arial,sans-serif;fill:#183c4d;text-anchor:middle}
      .small{font:16px Arial,sans-serif;fill:#3f5661;text-anchor:middle}
      .tiny{font:14px Arial,sans-serif;fill:#3f5661;text-anchor:middle}
      .arrow{fill:none;stroke:#376f86;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#7896a3;stroke-width:2;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="760" height="460" fill="#fff"/>
  <text x="380" y="38" class="label">Causal Evaluation Framework</text>

  <rect x="40" y="92" width="205" height="92" class="box"/>
  <text x="142" y="126" class="label">Policy Exposure</text>
  <text x="142" y="156" class="small">Low-carbon pilot cities</text>

  <rect x="292" y="92" width="176" height="92" class="soft"/>
  <text x="380" y="126" class="label">Listed Firms</text>
  <text x="380" y="156" class="small">Panel observations</text>

  <rect x="515" y="92" width="205" height="92" class="accent"/>
  <text x="617" y="126" class="label">Financialization</text>
  <text x="617" y="156" class="small">Firm-level response</text>

  <path d="M245 138 H284" class="arrow"/>
  <path d="M468 138 H507" class="arrow"/>

  <rect x="70" y="254" width="180" height="86" class="soft"/>
  <text x="160" y="287" class="label">Identification</text>
  <text x="160" y="315" class="small">Staggered DID</text>

  <rect x="290" y="254" width="180" height="86" class="soft"/>
  <text x="380" y="287" class="label">Validation</text>
  <text x="380" y="315" class="small">Event study · Placebo</text>

  <rect x="510" y="254" width="180" height="86" class="soft"/>
  <text x="600" y="287" class="label">Extensions</text>
  <text x="600" y="315" class="tiny">Mechanism · Heterogeneity</text>

  <path d="M160 254 V216 H380 V190" class="dash"/>
  <path d="M380 254 V190" class="dash"/>
  <path d="M600 254 V216 H380" class="dash"/>
  <text x="380" y="407" class="small">Policy shock → causal effect → robustness and interpretation</text>
</svg>
